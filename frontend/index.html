<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GVPCEW Attendance System</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <main class="container py-5">
    <section class="hero">
      <p class="eyebrow">GVPCEW</p>
      <h1>Automatic Attendance System</h1>
      <p class="lead">Admin, faculty, and student portals with face enrollment, attendance tracking, and reporting.</p>
      <div class="d-flex gap-2 flex-wrap">
        <a class="btn btn-primary" href="#dashboard">Open dashboard</a>
        <a class="btn btn-outline-light" href="../docs/README.md">Read documentation</a>
      </div>
    </section>

    <section id="dashboard" class="grid mt-5">
      <article class="panel"><h2>Total Students</h2><strong>0</strong></article>
      <article class="panel"><h2>Today's Attendance</h2><strong>0%</strong></article>
      <article class="panel"><h2>Low Attendance</h2><strong>0</strong></article>
      <article class="panel"><h2>Reports</h2><strong>Pending</strong></article>
    </section>
  </main>

</html>
